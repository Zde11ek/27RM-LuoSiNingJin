# 校内赛框架 RM_Frame_C（STM32F407IGH6 / RoboMaster C板）下载配置
#
# 烧录器: ST-Link/V2 (USB VID_0483 PID_3748)
#   注意: openocd 需要 WinUSB 驱动；若装的是 ST 官方驱动会报 "Error: open failed"，
#         需用 Zadig 把该设备驱动切换为 WinUSB
source [find interface/stlink.cfg]

# F4 系列通用（F407 / F427 都用它）
source [find target/stm32f4x.cfg]

# SWD 速度，2MHz；接线长或不稳定可降到 1000
adapter speed 2000
